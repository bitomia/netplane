[package]
name = "netplane_client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "netplane"
path = "src/client.rs"

[lib]
name = "netplane"
crate-type = ["staticlib", "cdylib"]
  
[dependencies]
netplane_common = { path = "../common" }
axum = { version = "0.8.1", features = ["ws"] }
log = "0.4.22"
tokio = { version = "1", features = ["full"] }
tun = { version = "0.8.4", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6.1", features = ["cors", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
dotenv = "0.15.0"
anyhow = "1.0.98"
env_logger = "0.11.8"
android_logger = { version = "0.14", optional = true }
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
bincode = "2.0.1"
snow = "0.9.6"
hmac = "0.12.1"
sha2 = "0.10.9"
jni = { version = "0.21", optional = true }
once_cell = "1.21.3"
tokio-util = "0.7.16"

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10.0", features = ["ksni"], optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-item = { version = "0.10.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[features]
default = []
android = ["jni", "android_logger"]
tray = ["tray-item"]

[build-dependencies]
embed-resource = { version = "3.0.2", optional = true }
