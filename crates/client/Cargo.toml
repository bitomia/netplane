[package]
name = "netplane_client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "netplane"
path = "src/main.rs"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
  
[dependencies]
netplane_common = { path = "../common" }
axum = { version = "0.8.1", features = ["ws"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tun = { version = "0.8.4", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6.1", features = ["cors", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
dotenv = "0.15.0"
anyhow = "1.0.98"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-android = { version = "0.2", optional = true }
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
bincode = "2.0.1"
snow = "0.9.6"
hmac = "0.12.1"
sha2 = "0.10.9"
jni = { version = "0.21", optional = true }
once_cell = "1.21.3"
tokio-util = "0.7.16"
chrono = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Low-level os_log bridge only; the `logger` (log-facade) feature is not needed
# because we forward tracing events to OsLog directly via a custom layer.
oslog = { version = "0.2", default-features = false }

[features]
default = []
android = ["jni", "tracing-android"]

[build-dependencies]
embed-resource = { version = "3.0.2", optional = true }
