[package]
name = "netplane_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "netplane-server"
path = "src/main.rs"

[dependencies]
netplane_common = { path = "../common" }
axum = { version = "0.8.1", features = ["ws"] }
log = "0.4.22"
tokio = { version = "1", features = ["full"] }
tun = { version = "0.7", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6.1", features = ["cors", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
dotenv = "0.15.0"
anyhow = "1.0.98"
env_logger = "0.11.8"
bytes = "1.10.1"
jsonwebtoken = "9.3.0"
bcrypt = "0.15.1"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8.5.0", features = ["axum"] }
axum-embed = "0.1.0"
rpassword = "7.3"
hex = "0.4"
base64 = "0.22.1"


[build-dependencies]
embed-resource = { version = "3.0.2", optional = true }
