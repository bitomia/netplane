[package]
name = "reticula"
version = "0.1.0"
edition = "2021"

[lib]
name = "reticula"
crate-type = ["staticlib"]

[[bin]]
name = "reticula"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.1", features = ["ws"] }
colog = "1.3.0"
libc = "0.2.169"
log = "0.4.22"
mio = "1.0.3"
nix = { version = "0.27", features = ["socket"] }
tokio = { version = "1", features = ["full"] }
tun = { version = "0.7", features = ["async"] }

