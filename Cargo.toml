[package]
name = "reticula"
version = "0.1.0"
edition = "2024"

[features]
client = ["tray-item", "embed-resource"]

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
required-features = ["client"]
  
[[bin]]
name = "migrate"
path = "src/migrate.rs"

[dependencies]
axum = { version = "0.8.1", features = ["ws"] }
colog = "1.3.0"
libc = "0.2.169"
log = "0.4.22"
mio = "1.0.3"
nix = { version = "0.27", features = ["socket"] }
tokio = { version = "1", features = ["full"] }
tun = { version = "0.7", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6.1", features = ["cors", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
dotenv = "0.15.0"
tray-item = { version = "0.10.0", optional = true }

[build-dependencies]
embed-resource = { version = "3.0.2", optional = true }
