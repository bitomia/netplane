name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install SQLx CLI
      run: cargo install sqlx-cli --no-default-features --features sqlite
      
    - name: Create database
      run: sqlx database create

    - name: Run migrations
      run: sqlx migrate run --source ./crates/server/src/migrations
      
    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Archive binary
      run: |
        mkdir -p dist
        tar -czvf dist/netplane-client.tar.gz target/release/netplane

    - name: Upload netplane client artifact
      uses: actions/upload-artifact@v4
      with:
        name: netplane-client
        path: dist/netplane-client.tar.gz
