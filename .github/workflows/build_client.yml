name: Build client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            suffix: linux
            archive: netplane-linux.tgz
            binary: netplane
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            suffix: macos
            archive: netplane-macos.tgz
            binary: netplane
            target: universal-apple-darwin
          - os: windows-latest
            suffix: windows
            archive: netplane-windows.zip
            binary: netplane.exe
            target: x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust target (if needed)
      if: matrix.target != 'universal-apple-darwin'
      run: rustup target add ${{ matrix.target }}

    - name: Install Rust targets for universal binary
      if: matrix.target == 'universal-apple-darwin'
      run: |
        rustup target add x86_64-apple-darwin
        rustup target add aarch64-apple-darwin

    - name: Install cbindgen
      run: cargo install --force cbindgen

    - name: Build client (non-macOS)
      if: matrix.target != 'universal-apple-darwin'
      run: cargo build --release -p netplane_client --verbose --target ${{ matrix.target }}

    - name: Build client (macOS universal)
      if: matrix.target == 'universal-apple-darwin'
      run: |
        cargo build --release -p netplane_client --verbose --target x86_64-apple-darwin
        cargo build --release -p netplane_client --verbose --target aarch64-apple-darwin
        mkdir -p target/universal-apple-darwin/release
        lipo -create \
          target/x86_64-apple-darwin/release/${{ matrix.binary }} \
          target/aarch64-apple-darwin/release/${{ matrix.binary }} \
          -output target/universal-apple-darwin/release/${{ matrix.binary }}

    - name: Run tests
      if: matrix.target != 'universal-apple-darwin'
      run: cargo test -p netplane_client --verbose --target ${{ matrix.target }}

    - name: Run tests (macOS universal - native arch only)
      if: matrix.target == 'universal-apple-darwin'
      run: cargo test -p netplane_client --verbose

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Build gonetplane
      working-directory: ee/gonetplane
      run: make bindgen

    - name: Run gonetplane tests (Linux)
      if: runner.os == 'Linux'
      working-directory: ee/gonetplane
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/target/${{ matrix.target }}/release
      run: make test

    - name: Archive binary
      shell: bash
      run: |
        mkdir -p dist
        BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          powershell Compress-Archive -Path $BIN_PATH -DestinationPath dist/${{ matrix.archive }}
        else
          tar -czvf dist/${{ matrix.archive }} -C $(dirname $BIN_PATH) $(basename $BIN_PATH)
        fi

    - name: Upload netplane client artifact
      uses: actions/upload-artifact@v4
      with:
        name: netplane-${{ matrix.suffix }}
        path: dist/${{ matrix.archive }}

    - name: Upload artifact to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Release
        draft: true
        overwrite: true
        files: dist/${{ matrix.archive }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_NETPLANE_RELEASE_TOKEN }}
