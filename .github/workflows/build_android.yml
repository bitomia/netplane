name: Build App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ee/app/src-tauri -> target

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ee/app
        run: bun install

      - name: Build Android APK
        working-directory: ee/app
        run: bun run tauri android build --apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          find ee/app/src-tauri/gen/android -type f -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NETPLANE_RELEASE_TOKEN }}

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: |
              ee/app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              ee/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: |
              ee/app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              ee/app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              ee/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              ee/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ee/app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ee/app
        run: bun install

      - name: Build Tauri app
        working-directory: ee/app
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NETPLANE_RELEASE_TOKEN }}
