[package]
name = "rust_lib_netplane"
version = "0.1.0"
edition = "2021"

# Standalone crate: exclude from the outer Cargo workspace at repo root.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
netplane_client = { path = "../../crates/client" }
netplane_common = { path = "../../crates/common" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
once_cell = "1"
anyhow = "1"
tracing = "0.1.44"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
